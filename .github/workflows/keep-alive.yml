name: keep-backend-awake

# El backend de Render es plan gratuito y se duerme tras ~15 min sin trafico.
# Este workflow hace ping al health endpoint cada 5 minutos para que nunca
# duerma, sin depender de cuentas externas. Es de solo lectura: no muta nada.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS -m 30 https://cubastockv2-api.onrender.com/api/health
